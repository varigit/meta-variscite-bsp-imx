#@TYPE: Machine
#@NAME: Variscite VAR-SOM-MX8X
#@SOC: i.MX8QXP
#@DESCRIPTION: Machine configuration for Variscite VAR-SOM-MX8X
#@MAINTAINER: Nate Drude <nate.d@variscite.com>
#
# http://www.variscite.com

MACHINEOVERRIDES =. "mx8qxp:mx8qxpc0:"
require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa35.inc

require include/variscite.inc
require include/variscite_bcm43xx.inc
require include/variscite-tpm.inc

PREFERRED_VERSION_cortexm-toolchain-cross-armv7e-m = "10.3-2021.10"

MACHINE_FEATURES:remove = "nxpiw612-sdio"

KERNEL_DEVICETREE = " \
	freescale/imx8qxp-var-som-symphony-1.x-sd.dtb \
	freescale/imx8qxp-var-som-symphony-1.x-wifi.dtb \
	freescale/imx8qxp-var-som-symphony-1.x-wifi-m4.dtb \
	freescale/imx8qxp-var-som-symphony-1.x-sd-m4.dtb \
	freescale/imx8qxp-var-som-symphony-sd.dtb \
	freescale/imx8qxp-var-som-symphony-wifi.dtb \
	freescale/imx8qxp-var-som-symphony-wifi-m4.dtb \
	freescale/imx8qxp-var-som-symphony-sd-m4.dtb \
"

SPL_BINARY = "spl/u-boot-spl.bin"
UBOOT_SUFFIX = "bin"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx8qxp_var_som_defconfig,sdcard"

ATF_PLATFORM = "imx8qx"
IMX_BOOT_SOC_TARGET = "iMX8QX"

# Set U-Boot DTB
UBOOT_DTB_NAME = "imx8qxp-var-som-symphony.dtb"

# Set imx-mkimage boot target
IMXBOOT_TARGETS = "flash_spl"

SERIAL_CONSOLES = "115200;ttyLP3"

IMAGE_BOOTLOADER = "imx-boot"

ROOTFS_SIZE = "3700"
LOADADDR = ""
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "32"
