SOC_DEFAULT_WKS_FILE = "var-imx-uboot-spl-bootpart.wks.in"

UBOOT_MAKE_TARGET = ""
SPL_BINARY = "SPL"
UBOOT_SUFFIX = "img"
UBOOT_CONFIG ??= "nand sd "
# The above order matters. The last one will be also called u-boot-${MACHINE} and will be used to create the sdcard.
UBOOT_CONFIG[sd] = "imx6ul_var_dart_mmc_defconfig,sdcard"
UBOOT_CONFIG[nand] = "imx6ul_var_dart_nand_defconfig,ubifs"

MACHINE_FIRMWARE:append = " linux-firmware-imx-sdma-imx6q"

# psplash.bbappend from meta-imx delays start of progress bar significantly and provides worse UI experience
BBMASK += "meta-imx/meta-imx-bsp/recipes-core/psplash/psplash_git.bbappend"
