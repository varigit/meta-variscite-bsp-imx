#@TYPE: Machine
#@NAME: Variscite DART-MX95
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Variscite DART-MX95
#@MAINTAINER: Francesco FErraro <francesco.f@variscite.com>

MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

require include/variscite.inc
require include/variscite-tpm.inc

PREFERRED_VERSION_cortexm-toolchain-cross-armv8-m = "10.3-2021.10"

MACHINE_FEATURES += "nxpiw612-sdio"

KERNEL_DEVICETREE = " \
    freescale/imx95-var-dart-dt8mcustomboard.dtb \
    freescale/imx95-var-dart-1.0-dt8mcustomboard.dtb \
    freescale/imx95-var-dart-sonata.dtb \
    freescale/imx95-var-dart-1.0-sonata.dtb \
"
UBOOT_DTB_NAME ?= "imx95-var-dart-dt8mcustomboard.dtb"

LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = ""

SPL_BINARY = "spl/u-boot-spl.bin"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd]   = "imx95_var_dart_defconfig,sdcard"

# Set ATF platform name
ATF_PLATFORM = "imx95"
OEI_CONFIGS = "ddr tcm"
OEI_CORE   = "m33"
OEI_SOC    = "mx95"
OEI_BOARD  = "mx95lp5"
DDR_TYPE   = "lpddr5"

SYSTEM_MANAGER_CONFIG = "mx95evk"

IMXBOOT_TARGETS = "flash_a55"

IMX_BOOT_SOC_TARGET = "iMX95"
IMX_BOOT_SEEK = "32"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttyLP0"

DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202311.bin \
    lpddr5_dmem_qb_v202311.bin \
    lpddr5_imem_v202311.bin \
    lpddr5_imem_qb_v202311.bin \
"

MACHINE_EXTRA_RRECOMMENDS:remove = " imx-m7-demos"
BBMASK += "meta-imx/meta-imx-bsp/recipes-bsp/imx-mkimage/imx-boot_1.0.bbappend"
