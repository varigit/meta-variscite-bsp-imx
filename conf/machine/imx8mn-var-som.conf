#@TYPE: Machine
#@NAME: Variscite VAR-SOM-MX8M-NANO
#@SOC: i.MX8MN
#@DESCRIPTION: Machine configuration for Variscite VAR-SOM-MX8M-NANO
#@MAINTAINER: Nate Drude <nate.d@variscite.com>
#
# http://www.variscite.com

MACHINEOVERRIDES =. "mx8mn:"
require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

require include/variscite.inc
require include/variscite_bcm43xx.inc
require include/variscite-tpm.inc

MACHINE_FEATURES:append = " nxpiw612-sdio"

KERNEL_DEVICETREE = " \
	freescale/imx8mn-var-som-1.x-symphony.dtb \
	freescale/imx8mn-var-som-1.x-symphony-m7.dtb \
	freescale/imx8mn-var-som-1.x-symphony-root.dtb \
	freescale/imx8mn-var-som-1.x-symphony-1.x.dtb \
	freescale/imx8mn-var-som-1.x-symphony-1.x-m7.dtb \
	freescale/imx8mn-var-som-1.x-symphony-1.x-root.dtb \
	freescale/imx8mn-var-som-inmate.dtb \
	freescale/imx8mn-var-som-symphony-1.x.dtb \
	freescale/imx8mn-var-som-symphony-1.x-m7.dtb \
	freescale/imx8mn-var-som-symphony-1.x-root.dtb \
	freescale/imx8mn-var-som-symphony.dtb \
	freescale/imx8mn-var-som-symphony-m7.dtb \
	freescale/imx8mn-var-som-symphony-root.dtb \
	freescale/imx8mn-var-som-wbe-symphony-1.x.dtb \
	freescale/imx8mn-var-som-wbe-symphony-1.x-m7.dtb \
	freescale/imx8mn-var-som-wbe-symphony-1.x-root.dtb \
	freescale/imx8mn-var-som-wbe-symphony.dtb \
	freescale/imx8mn-var-som-wbe-symphony-m7.dtb \
	freescale/imx8mn-var-som-wbe-symphony-root.dtb \
"

MACHINE_EXTRA_RRECOMMENDS:remove = " imx-m7-demos"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx8mn_var_som_config,sdcard"
SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mn"
ATF_LOAD_ADDR = "0x960000"

# Extra firmware package name, that is required to build boot container for fslc bsp
IMX_EXTRA_FIRMWARE = "firmware-imx-8m"

# Set DDR FIRMWARE
DDR_FIRMWARE_NAME = " \
	ddr4_imem_1d_201810.bin \
	ddr4_dmem_1d_201810.bin \
	ddr4_imem_2d_201810.bin \
	ddr4_dmem_2d_201810.bin \
"

# Set U-Boot DTB
UBOOT_DTB_NAME ?= "imx8mn-var-som-symphony.dtb"

# Set imx-mkimage boot target
IMXBOOT_TARGETS = "flash_ddr4_evk"
IMX_BOOT_SOC_TARGET = "iMX8MN"

SERIAL_CONSOLES = "115200;ttymxc3"

IMAGE_BOOTLOADER = "imx-boot"

ROOTFS_SIZE = "3700"
LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "32"
