#@TYPE: Machine
#@NAME: Variscite DART-MX8M-MINI
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for Variscite DART-MX8M-MINI and VAR-SOM-MX8M-MINI
#@MAINTAINER: Nate Drude <nate.d@variscite.com>
#
# http://www.variscite.com

MACHINEOVERRIDES =. "mx8mm:"
require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

require include/variscite.inc
require include/variscite_bcm43xx.inc
require include/variscite-tpm.inc

MACHINE_FEATURES:append = " nxpiw612-sdio"

KERNEL_DEVICETREE = " \
	freescale/imx8mm-var-dart-1.x-dt8mcustomboard.dtb \
	freescale/imx8mm-var-dart-1.x-dt8mcustomboard-m4.dtb \
	freescale/imx8mm-var-dart-dt8mcustomboard.dtb \
	freescale/imx8mm-var-dart-dt8mcustomboard-m4.dtb \
	freescale/imx8mm-var-dart-wbe-dt8mcustomboard.dtb \
	freescale/imx8mm-var-dart-wbe-dt8mcustomboard-m4.dtb \
	freescale/imx8mm-var-som-1.x-symphony.dtb \
	freescale/imx8mm-var-som-1.x-symphony-1.x.dtb \
	freescale/imx8mm-var-som-1.x-symphony-m4.dtb \
	freescale/imx8mm-var-som-1.x-symphony-1.x-m4.dtb \
	freescale/imx8mm-var-som-symphony.dtb \
	freescale/imx8mm-var-som-symphony-1.x.dtb \
	freescale/imx8mm-var-som-symphony-m4.dtb \
	freescale/imx8mm-var-som-symphony-1.x-m4.dtb \
	freescale/imx8mm-var-som-wbe-symphony.dtb \
	freescale/imx8mm-var-som-wbe-symphony-1.x.dtb \
	freescale/imx8mm-var-som-wbe-symphony-m4.dtb \
	freescale/imx8mm-var-som-wbe-symphony-1.x-m4.dtb \
	freescale/imx8mm-var-dart-1.x-sonata.dtb \
	freescale/imx8mm-var-dart-1.x-sonata-m4.dtb \
	freescale/imx8mm-var-dart-sonata.dtb \
	freescale/imx8mm-var-dart-sonata-m4.dtb \
	freescale/imx8mm-var-dart-wbe-sonata.dtb \
	freescale/imx8mm-var-dart-wbe-sonata-m4.dtb \
"

MACHINE_EXTRA_RRECOMMENDS:remove = " imx-m4-demos"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx8mm_var_dart_config,sdcard"
SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mm"
ATF_LOAD_ADDR = "0x920000"

# Set DDR FIRMWARE
DDR_FIRMWARE_NAME = " \
	ddr4_imem_1d.bin \
	ddr4_dmem_1d.bin \
	ddr4_imem_2d.bin \
	ddr4_dmem_2d.bin \
	lpddr4_pmu_train_1d_imem.bin \
	lpddr4_pmu_train_1d_dmem.bin \
	lpddr4_pmu_train_2d_imem.bin \
	lpddr4_pmu_train_2d_dmem.bin \
"
# Set U-Boot DTB
UBOOT_DTB_NAME ?= "imx8mm-var-dart-dt8mcustomboard.dtb"
UBOOT_DTB_EXTRA ?= "imx8mm-var-som-symphony.dtb"

# Set imx-mkimage boot target
IMXBOOT_TARGETS = "flash_lpddr4_ddr4_evk"

IMX_BOOT_SOC_TARGET = "iMX8MM"

# Extra firmware package name, that is required to build boot container for fslc bsp
IMX_EXTRA_FIRMWARE = "firmware-imx-8m"

SERIAL_CONSOLES = "115200;ttymxc0 115200;ttymxc3"

IMAGE_BOOTLOADER = "imx-boot"

ROOTFS_SIZE = "3700"
LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "33"

# If you change TEE_LOAD_ADDR, make sure to align patch for soc.mak
TEE_LOAD_ADDR ?= "0x56000000"
TEE_CFG_DDR_SIZE ?= "0x80000000"

# Mender Configuration
require include/variscite-mender.inc
MENDER_UBOOT_CONFIG_SYS_MMC_ENV_PART ?= "0"
MENDER_STORAGE_DEVICE_BASE ?= "/dev/mmcblk2p"
MENDER_STORAGE_DEVICE ?= "/dev/mmcblk2"
MENDER_PARTITION_ALIGNMENT = "262144"
MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET = "7340032"
MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET_1 = "0x700000"
MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET_2 = "0x740000"

# Must match U-Boot CONFIG_SYS_MMC_ENV_DEV.
MENDER_UBOOT_STORAGE_DEVICE = "2"
