# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "variscite-bsp"
BBFILE_PATTERN_variscite-bsp := "^${LAYERDIR}/"
BBFILE_PRIORITY_variscite-bsp = "9"

LAYERSERIES_COMPAT_variscite-bsp = "wrynose"

LAYERDEPENDS_variscite-bsp = " \
    variscite-bsp-common \
    fsl-bsp-release \
"

BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/*/*/*.bbappend \
    mender:${LAYERDIR}/dynamic-layers/mender/*/*/*.bb \
    mender:${LAYERDIR}/dynamic-layers/mender/*/*/*.bbappend \
    nxp-matter-baseline:${LAYERDIR}/dynamic-layers/nxp-matter-baseline/*/*/*.bb \
    nxp-matter-baseline:${LAYERDIR}/dynamic-layers/nxp-matter-baseline/*/*/*.bbappend \
"
